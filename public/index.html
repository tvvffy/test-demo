<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>教辅工作管理</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <h1>教辅工作管理</h1>
        <p>任务与排班安排 · 工作完成情况统计</p>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="staffBtn" title="管理教辅人员">👥</button>
        <button class="icon-btn" id="themeBtn" title="切换深色/浅色">🌓</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-view="dashboard">仪表盘</button>
      <button class="tab-btn" data-view="tasks">任务与排班</button>
    </nav>

    <!-- Dashboard -->
    <section class="view active" id="view-dashboard">
      <div class="stat-grid" id="statTiles"></div>

      <div class="panel">
        <div class="panel-title">按教辅人员统计<span class="hint">完成率 = 已完成 / 总任务</span></div>
        <div id="staffMeters"></div>
      </div>

      <div class="panel">
        <div class="panel-title">需要关注：已逾期任务</div>
        <div id="overdueList"></div>
      </div>

      <div class="panel">
        <div class="panel-title">按任务类型统计</div>
        <table class="type-table" id="typeTable"></table>
      </div>
    </section>

    <!-- Tasks -->
    <section class="view" id="view-tasks">
      <div class="toolbar">
        <select id="filterAssignee"><option value="">全部人员</option></select>
        <select id="filterStatus">
          <option value="">全部状态</option>
          <option value="待开始">待开始</option>
          <option value="进行中">进行中</option>
          <option value="已完成">已完成</option>
          <option value="已逾期">已逾期</option>
        </select>
        <div class="spacer"></div>
        <button class="btn btn-primary" id="newTaskBtn">+ 新建任务</button>
      </div>

      <div class="panel" style="padding-top: 4px;">
        <div id="taskTableWrap"></div>
      </div>
    </section>
  </div>

  <!-- Task modal -->
  <div class="modal-backdrop" id="taskModalBackdrop">
    <div class="modal">
      <h2 id="taskModalTitle">新建任务</h2>
      <form id="taskForm">
        <input type="hidden" id="taskId" />
        <div class="field">
          <label for="taskTitle">任务标题</label>
          <input type="text" id="taskTitle" required placeholder="例如：高二数学周测批改" />
        </div>
        <div class="field-row">
          <div class="field">
            <label for="taskType">类型</label>
            <select id="taskType"></select>
          </div>
          <div class="field">
            <label for="taskAssignee">负责人</label>
            <select id="taskAssignee"><option value="">未分配</option></select>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="taskScheduled">排期日期</label>
            <input type="date" id="taskScheduled" />
          </div>
          <div class="field">
            <label for="taskDue">截止日期</label>
            <input type="date" id="taskDue" />
          </div>
        </div>
        <div class="field">
          <label for="taskStatus">状态</label>
          <select id="taskStatus">
            <option value="待开始">待开始</option>
            <option value="进行中">进行中</option>
            <option value="已完成">已完成</option>
          </select>
        </div>
        <div class="field">
          <label for="taskNotes">备注</label>
          <textarea id="taskNotes" rows="2" placeholder="选填"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn" id="taskCancelBtn">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Staff modal -->
  <div class="modal-backdrop" id="staffModalBackdrop">
    <div class="modal">
      <h2>教辅人员</h2>
      <ul class="staff-list" id="staffList"></ul>
      <div class="staff-add-row">
        <input type="text" id="newStaffName" placeholder="输入姓名后添加" />
        <button class="btn btn-primary" id="addStaffBtn">添加</button>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="staffCloseBtn">关闭</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
